name: Android APK

# Тестовий APK для встановлення на телефон: Actions → запуск → Artifacts → gmaster-debug-apk
on:
  push:
    paths: ['web/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run android
      - name: Gradle assembleDebug
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gmaster-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
